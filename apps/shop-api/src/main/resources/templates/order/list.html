<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>주문 목록</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; margin: 24px; color: #1c2128; }
    h1 { font-size: 20px; }
    form { margin: 12px 0; }
    input, button { padding: 6px 10px; font-size: 13px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border: 1px solid #d7dbe0; padding: 8px 10px; text-align: left; }
    th { background: #f1f3f6; }
    .state { font-weight: 700; }
    a { color: #3b5bdb; text-decoration: none; }
  </style>
</head>
<body>
<!--/* linked_func: FUNC-order-001
     spec: docs/00_FUNC/stories/STORY-FUNC-order-001.md */-->
<h1>주문 목록</h1>
<!--/* linked_func: FUNC-order-001 — SR-205 round2(QA r1 FAIL 필수2): 기존 공통 오류 배너 패턴
     (cart/list.html의 checkoutError, product/detail.html의 addToCartError)을 따른다.
     OrderViewController가 4xx(예: 조회 구간 역전 400)만 흡수해 여기로 전달한다. */-->
<div th:if="${searchError != null}">
  <p th:text="'조회 실패: ' + ${searchError}">조회 실패</p>
</div>
<form method="get" action="/order/list" id="searchForm">
  <label>회원 ID <input type="text" name="memberId" th:value="${memberId}" placeholder="M-0001"></label>
  <!-- linked_func: FUNC-order-001 — 주문상태 필터 (LAB-101) -->
  <label>주문상태
    <select name="orderState" id="selState">
      <option value="" th:selected="${orderState == ''}">전체</option>
      <option th:each="s : ${ {'PLACED','PAID','SHIPPED','PARTIAL_SHIPPED','CANCELED','DONE'} }"
              th:value="${s}" th:text="${s}" th:selected="${orderState == s}">PLACED</option>
    </select>
  </label>
  <!--/* linked_func: FUNC-order-001 — SR-205 조회 기간(시작~종료) 필터: 기존 orderState와 AND
       결합해 GET /order/list로 재요청된다. 미입력 시 최근 30일 기본값은 서버(OrderService.list)가
       적용 — 입력창은 자동으로 채우지 않는다([미상] 최소가정). */-->
  <label>시작일 <input type="date" name="startDate" id="startDate" th:value="${startDate}"></label>
  <label>종료일 <input type="date" name="endDate" id="endDate" th:value="${endDate}"></label>
  <button type="submit" id="btnSearch">검색</button>
  <!--/* linked_func: FUNC-order-001 — SR-209: 조회기간 프리셋 버튼(최근 7/30/90일). 클릭 시
       #startDate·#endDate를 오늘 기준 N일 전~오늘로 채우고 #btnSearch와 동일하게 폼을 제출해
       GET /order/list를 재요청한다(같은 폼 안이라 memberId·orderState는 그대로 유지되어 AND 결합).
       신규 API 파라미터·응답 필드는 추가하지 않는다(INF-ORD-003 계약 불변). */-->
  <button type="button" id="btnPreset7" onclick="applyOrderDatePreset(7)">최근 7일</button>
  <button type="button" id="btnPreset30" onclick="applyOrderDatePreset(30)">최근 30일</button>
  <button type="button" id="btnPreset90" onclick="applyOrderDatePreset(90)">최근 90일</button>
</form>
<!--/* linked_func: FUNC-order-001 — SR-208: 4xx(searchError != null) 시 그리드(③) 자체를 숨긴다.
     정상 조회(오류 없음)일 때만 렌더 — 결과 0건이라도 오류가 아니면 종전대로 빈 테이블을 보여준다. */-->
<!--/* linked_func: FUNC-order-001 — SR-210: 6번째 열 "배송상태" 추가. 기존 5개 열(주문번호·회원·
     상태·총액·주문일시)의 순서·내용은 변경하지 않는다(scope_freeze). 값은 컨트롤러가 화면 조회
     경로에서 별도 조합한 deliveryStatusByOrderNo(주문번호→최신 배송상태) 맵에서 찾고, 없으면
     "-"(배송 이력 없음)로 표시한다. */-->
<table th:if="${searchError == null}">
  <thead>
  <tr><th>주문번호</th><th>회원</th><th>상태</th><th>총액</th><th>주문일시</th><th>배송상태</th></tr>
  </thead>
  <tbody>
  <tr th:each="o : ${result['items']}">
    <td><a th:href="@{'/order/' + ${o.orderNo}}" th:text="${o.orderNo}">20260817-0001</a></td>
    <td th:text="${o.memberName} + ' (' + ${o.memberId} + ')'">김실증 (M-0001)</td>
    <td class="state" th:text="${o.orderState}">PLACED</td>
    <td th:text="${#numbers.formatInteger(o.totalAmount, 3, 'COMMA')} + '원'">129,000원</td>
    <td th:text="${#temporals.format(o.orderedAt, 'yyyy-MM-dd HH:mm')}">2026-08-17 09:00</td>
    <td th:text="${deliveryStatusByOrderNo.get(o.orderNo)} ?: '-'">-</td>
  </tr>
  </tbody>
</table>
<!--/* linked_func: FUNC-order-001 — SR-205 scr_empty_state: 조회 결과 0건 안내 문구.
     SR-208: searchError가 null일 때만 표시(4xx 시 숨김) — 정상 0건(회귀)은 그대로 유지.
     SR-224: 검색조건(memberId/orderState/startDate/endDate) 유무로 문구를 구분한다(product/list.html과
     동일 컨벤션) — 조건 없으면 "조회 결과가 없습니다", 조건이 하나라도 있으면
     "조건에 맞는 결과가 없습니다". memberId/orderState/startDate/endDate는 컨트롤러가 null을 ''로
     정규화해 모델에 넣으므로(OrderViewController.orderList) 빈 문자열 비교로 조건 유무를 판별한다.
     round7 정정(QA r7 권고②, STORY-FUNC-order-011): cart/list.html은 이 컨벤션 대상이 아니다 —
     장바구니 화면의 회원 셀렉트는 검색/필터 조건이 아니라 "조회 대상(누구의 장바구니인지) 식별용"
     파라미터라 검색조건 유무 분기 자체가 없다(단일 문구만 사용, cart/list.html:82-89 주석 참조).
     이전 버전의 "cart/list.html과 동일 컨벤션" 표현은 사실과 달랐다. */-->
<p th:if="${searchError == null and #lists.isEmpty(result['items']) and memberId == '' and orderState == '' and startDate == '' and endDate == ''}">조회 결과가 없습니다</p>
<p th:if="${searchError == null and #lists.isEmpty(result['items']) and (memberId != '' or orderState != '' or startDate != '' or endDate != '')}">조건에 맞는 결과가 없습니다</p>
<!--/* linked_func: FUNC-order-001 — SR-208: "전체 N건" 라벨도 searchError가 null일 때만 표시 */-->
<p th:if="${searchError == null}">전체 <span th:text="${result['totalCount']}">5</span>건</p>
<!--/* linked_func: FUNC-order-001 — SR-209: 프리셋 버튼(#btnPreset7/30/90)이 호출하는 날짜 계산 +
     즉시 재조회. #searchForm 제출과 동일 경로(GET /order/list)라 memberId·orderState 값은 폼에
     남아 있는 그대로 함께 전송된다. */-->
<script th:inline="none">
  function applyOrderDatePreset(days) {
    var end = new Date();
    var start = new Date();
    start.setDate(start.getDate() - days);
    document.getElementById('startDate').value = formatOrderDate(start);
    document.getElementById('endDate').value = formatOrderDate(end);
    document.getElementById('searchForm').submit();
  }
  function formatOrderDate(d) {
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }
</script>
</body>
</html>
