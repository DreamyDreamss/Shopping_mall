<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>상품 목록</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; margin: 24px; color: #1c2128; }
    h1 { font-size: 20px; }
    form { margin: 12px 0; }
    input, button { padding: 6px 10px; font-size: 13px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border: 1px solid #d7dbe0; padding: 8px 10px; text-align: left; }
    th { background: #f1f3f6; }
    .state { font-weight: 700; }
    a { color: #3b5bdb; text-decoration: none; }
  </style>
</head>
<body>
<h1>상품 목록</h1>
<form method="get" action="/product/list" id="searchForm">
  <!--/* linked_func: FUNC-order-009 — 상품명 키워드 검색(부분일치, SR-201) */-->
  <label>상품명 <input type="text" name="keyword" th:value="${keyword}" placeholder="키보드"></label>
  <!--/* linked_func: FUNC-order-009 — 정렬 셀렉트(기본순 기본/가격 낮은순/가격 높은순, SR-214).
       onchange 시 자동 제출(cart/list.html #selMember와 동일 패턴)로 GET /product/list?sort=...를
       재요청 — 선택값이 URL 파라미터로 남아 새로고침·뒤로가기에도 유지된다. 값이 이상하면 컨트롤러가
       조용히 "latest"로 되돌리므로 이 셀렉트는 항상 유효한 옵션 중 하나가 선택된 채로 렌더된다.
       라벨 "기본순"은 sort=latest의 실제 동작(ORDER BY p.sku ASC = 기존 등록순)에 맞춘 표기다 —
       PRODUCTS에 등록일시 컬럼이 없어 참 최신순은 구현하지 않는다(재작업 지시, SR-214 QA r5). */-->
  <label>정렬
    <select name="sort" id="selSort" onchange="this.form.submit()">
      <option value="latest" th:selected="${sort == 'latest'}">기본순</option>
      <option value="priceAsc" th:selected="${sort == 'priceAsc'}">가격 낮은순</option>
      <option value="priceDesc" th:selected="${sort == 'priceDesc'}">가격 높은순</option>
    </select>
  </label>
  <button type="submit" id="btnSearch">검색</button>
</form>
<table th:unless="${#lists.isEmpty(products)}">
  <thead>
  <tr><th>SKU</th><th>상품명</th><th>가격</th><th>재고</th><th>상태</th></tr>
  </thead>
  <tbody>
  <tr th:each="p : ${products}">
    <td th:text="${p.sku}">SKU-1001</td>
    <td><a th:href="@{'/product/' + ${p.sku}}" th:text="${p.productName}">마우스</a></td>
    <td th:text="${#numbers.formatInteger(p.price, 3, 'COMMA')} + '원'">25,000원</td>
    <td th:text="${p.stockQty}">100</td>
    <!--/* linked_func: FUNC-order-009 — SR-230: 품절 문구를 '일시 품절'로(담기 차단은 그대로) */-->
    <td class="state" th:text="${p.stockQty == 0} ? '일시 품절' : '판매중'">판매중</td>
  </tr>
  </tbody>
</table>
<!--/* linked_func: FUNC-order-009 — 빈 결과 문구 통일(SR-224): 검색조건(keyword) 유무로 문구 구분, 오류 배너와는 별개 */-->
<p th:if="${#lists.isEmpty(products) and (keyword == null or keyword == '')}">조회 결과가 없습니다</p>
<p th:if="${#lists.isEmpty(products) and keyword != null and keyword != ''}">조건에 맞는 결과가 없습니다</p>
</body>
</html>
